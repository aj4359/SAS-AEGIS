name: AEGIS Proof Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run AEGIS proof tests
        run: python -m pytest -q aegis
